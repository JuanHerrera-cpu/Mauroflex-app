<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario - Mauroflex</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f5f6fa;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            color: #2c2c54;
            margin-bottom: 30px;
        }

        h3 {
            color: #2c2c54;
            margin-top: 20px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 12px;
            border: 1px solid #dcdde1;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 6px;
            background: linear-gradient(180deg, #2c2c54, #6c5ce7);
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #2c2c54;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 30px;
        }

        th,
        td {
            padding: 12px;
            border: 1px solid #dcdde1;
            text-align: left;
        }

        th {
            background: linear-gradient(180deg, #2c2c54, #6c5ce7);
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f8f9fc;
        }

        tr:hover {
            background-color: #ececff;
        }

        .stock-bajo {
            color: red;
            font-weight: bold;
        }
    </style>

</head>

<body>

    <div class="container">

        <h1>Inventario de Productos - Mauroflex</h1>

        <h3>Agregar Producto</h3>

        <input type="text" id="producto" placeholder="Nombre del producto">

        <input type="number" id="stock" placeholder="Cantidad en stock">

        <input type="number" id="precio" placeholder="Precio">

        <button onclick="agregarProducto()">
            Agregar Producto
        </button>

        <table>

            <thead>

                <tr>

                    <th>Producto</th>

                    <th>Stock</th>

                    <th>Precio Unitario</th>

                </tr>

            </thead>

            <tbody id="tablaInventario">

            </tbody>

        </table>

    </div>

    <script src="inventario.js"></script>

</body>

</html>
